document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:14px;--text-base:16px;--text-lg:19px;--text-xl:24px;--text-2xl:32px;--text-3xl:44px;--text-4xl:60px;\n--leading-tight:1.1;--leading-snug:1.3;--leading-body:1.6;\n--tracking-caps:0.06em;\n--weight-light:300;--weight-regular:400;--weight-medium:500;--weight-bold:700;--weight-black:900;\n}\n\n:root{\n/* Spacing */\n--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--space-9:96px;\n/* Radii — \"rounded effect of most design elements gives a modern, approachable look\" (brand guide p.28) */\n--radius-sm:6px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;\n/* Borders */\n--border-width:1px;--border-width-strong:3px;\n/* Shadows — collateral is mostly flat print; keep soft & sparing */\n--shadow-card:0 1px 3px rgba(0,42,77,.08),0 4px 12px rgba(0,42,77,.06);\n--shadow-raised:0 6px 24px rgba(0,42,77,.14);\n/* Motion */\n--ease-standard:cubic-bezier(.4,0,.2,1); /* @kind other */\n--duration-fast:120ms; /* @kind other */\n--duration-base:200ms; /* @kind other */\n}\nbody{margin:0;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page);font-size:var(--text-base);line-height:var(--leading-body);}\na{color:var(--link);text-decoration-color:var(--merriam-yellow);text-decoration-thickness:2px;}\na:hover{color:var(--link-hover);}\n\n<\u002Fstyle>\n<script type=\"importmap\">\n{\n  \"imports\": {\n    \"three\": \"https://unpkg.com/three@0.184.0/build/three.module.js\",\n    \"three/addons/controls/OrbitControls.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\",\n    \"three/addons/exporters/OBJExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\",\n    \"three/addons/exporters/GLTFExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\"\n  },\n  \"integrity\": {\n    \"https://unpkg.com/three@0.184.0/build/three.module.js\": \"sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0 .t b{background:#0058a0;color:#fff;border-radius:999px;padding:3px 7px;font:700 12px/1 var(--font-headline,'Basic Sans',sans-serif)}\n  .lbl.t span{color:#0058a0;font:700 9px/1 var(--font-sub,'Figtree',sans-serif);text-transform:uppercase;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}\n  .lbl.st{transform:translate(-50%,-50%);color:#222;font:700 11px/1 var(--font-sub,'Figtree',sans-serif);text-transform:uppercase;letter-spacing:.06em;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}\n  .lbl.st.water{color:#0072a8}\n  #loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#0058a0;font:700 15px/1.4 var(--font-sub,'Figtree',sans-serif);text-transform:uppercase;z-index:4;background:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"hdr\"><div class=\"tag\">Vision C<\u002Fdiv><div><div class=\"t\">Downtown Merriam<\u002Fdiv><div class=\"s\">Vision C street network with infill typologies<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div id=\"labels\"><\u002Fdiv>\n<div id=\"loading\">Loading typologies…<\u002Fdiv>\n<div class=\"views\" id=\"views\"><\u002Fdiv>\n<three-d-stage name=\"downtown-merriam-vision-c\" background=\"#ffffff\"><\u002Fthree-d-stage>\n<script src=\"d0ae2975-8cf5-4a27-9a88-437b7239afc9\"><\u002Fscript>\n<script type=\"application/json\" id=\"typology-sources\">{\"Townhomes Condos 3D.html\":\"\\nconst stage = document.querySelector('three-d-stage');\\nconst { THREE } = await stage.ready;\\n\\nconst M = (name, color, rough = 0.8) => { const m = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0 }); m.name = name; return m; };\\nconst mat = {\\n  asphalt: M('asphalt', 0x3f3f3f, 0.9),\\n  sidewalk: M('sidewalk', 0xd9d9d9, 0.9),\\n  earth: M('earth_gray', 0xbfbfbf, 0.95),\\n  ground: M('ground_floor_gray', 0xbfbfbf, 0.85),\\n  blue: M('merriam_blue', 0x0058a0, 0.6),\\n  blueTint: M('blue_tint', 0x6699c5, 0.6),\\n  glass: M('window_glass', 0x66ccf5, 0.2),\\n  garageDoor: M('garage_door', 0xffe08a, 0.7),\\n  dark: M('door_black', 0x1f1f1f, 0.5),\\n  garage: M('section_garage', 0x3f3f3f, 0.8),\\n  stair: M('section_stair', 0xbfbfbf, 0.8),\\n  living: M('section_living_kitchen', 0xffe08a, 0.8),\\n  beds: M('section_bedrooms', 0xffc425, 0.7),\\n  canopy: M('tree_canopy', 0xc0d842, 0.7),\\n};\\n\\n// Feet → meters. x: along the row. z: alley (0) → Merriam Drive (72). y: grade.\\nconst F = 0.3048, D = 72, G = 13, TOP = 33, RIDGE = 42, t = 0.12;\\nfunction box(g, name, m, x0, x1, y0, y1, z0, z1) {\\n  const o = new THREE.Mesh(new THREE.BoxGeometry((x1-x0)*F, (y1-y0)*F, (z1-z0)*F), m);\\n  o.name = name; o.position.set((x0+x1)/2*F, (y0+y1)/2*F, (z0+z1)/2*F);\\n  o.castShadow = o.receiveShadow = true; g.add(o); return o;\\n}\\nfunction hipRoof(name, m, x0, x1) {\\n  const w = x1 - x0, xc = (x0 + x1) / 2, h = RIDGE - TOP, r0 = w / 2, r1 = D - w / 2;\\n  const A = [x0, TOP, 0], B = [x1, TOP, 0], C = [x1, TOP, D], Dd = [x0, TOP, D], R1 = [xc, RIDGE, r0], R2 = [xc, RIDGE, r1];\\n  const tris = [A, R1, B,  B, R1, R2,  B, R2, C,  C, R2, Dd,  Dd, R2, R1,  Dd, R1, A];\\n  const geo = new THREE.BufferGeometry();\\n  geo.setAttribute('position', new THREE.Float32BufferAttribute(tris.flat().map(v => v * F), 3));\\n  geo.computeVertexNormals();\\n  const o = new THREE.Mesh(geo, m); o.name = name; o.castShadow = o.receiveShadow = true; return o;\\n}\\n\\nconst model = new THREE.Group(); model.name = 'townhomes_condos';\\nconst X0 = -12, X1 = 208;\\nconst site = new THREE.Group(); site.name = 'site';\\nbox(site, 'earth', mat.earth, X0, X1, -3, -0.3, -22, 110);\\nbox(site, 'alley', mat.asphalt, X0, X1, -0.3, 0.02, -22, 0);\\nbox(site, 'lot', mat.sidewalk, X0, X1, -0.3, 0, 0, D);\\nbox(site, 'merriam_sidewalk', mat.sidewalk, X0, X1, -0.3, 0.1, D, D + 12);\\nbox(site, 'merriam_drive', mat.asphalt, X0, X1, -0.6, -0.05, D + 12, 110);\\nfor (const [x0, x1] of [[0, 88], [108, 196]]) box(site, 'frontage_paving', mat.garageDoor, x0, x1, 0.1, 0.2, D, D + 8);\\nfor (const [i, x] of [93, 103, 201].entries()) {\\n  box(site, `street_tree_${i+1}_trunk`, mat.dark, x - 0.4, x + 0.4, 0, 8, D + 6 - 0.4, D + 6 + 0.4);\\n  const s = new THREE.Mesh(new THREE.SphereGeometry(5*F, 32, 20), mat.canopy);\\n  s.name = `street_tree_${i+1}_canopy`; s.position.set(x*F, 12*F, (D + 6)*F); s.castShadow = true; site.add(s);\\n}\\nmodel.add(site);\\n\\n// Four 44-ft buildings, two 22-ft units each; 20-ft gap in the middle\\nconst buildings = [['building_1', 0, mat.blue], ['building_2', 44, mat.blueTint], ['building_3', 108, mat.blueTint], ['building_4', 152, mat.blue]];\\nfor (const [bn, bx, upper] of buildings) {\\n  const g = new THREE.Group(); g.name = bn;\\n  box(g, bn + '_ground_floor', mat.ground, bx, bx + 44, 0, G, 0, D);\\n  box(g, bn + '_upper_floors', upper, bx, bx + 44, G, TOP, 0, D);\\n  g.add(hipRoof(bn + '_roof', upper, bx, bx + 44));\\n  box(g, bn + '_merriam_ground_facade', upper, bx, bx + 44, 0, G, D - 0.01, D + 0.06);\\n  box(g, bn + '_gable_vent', mat.garageDoor, bx + 21, bx + 23, TOP, 40, D - 1.6, D - 1.4);\\n  box(g, bn + '_party_wall', mat.dark, bx + 21.9, bx + 22.1, 0.01, TOP, -t, D + t);\\n  for (const [ui, ux] of [[1, bx], [2, bx + 22]].map(([i, x]) => [i, x])) {\\n    const u = `${bn}_unit_${ui}`;\\n    // Alley side\\n    box(g, u + '_garage_door_9x8', mat.garageDoor, ux + 2, ux + 11, 0, 8, -t, 0.01);\\n    box(g, u + '_service_entry', mat.dark, ux + 14, ux + 17, 0, 7, -t, 0.01);\\n    for (const wx of [4, 13]) for (const wy of [15, 25]) box(g, u + '_alley_window', mat.glass, ux + wx, ux + wx + 5, wy, wy + 5, -t, 0.01);\\n    // Merriam Drive side\\n    box(g, u + '_commercial_storefront', mat.glass, ux + 2.1, ux + 15.4, 0.3, 10.5, D, D + t + 0.06);\\n    box(g, u + '_commercial_door', mat.dark, ux + 15.4, ux + 20.7, 0, 11, D, D + t + 0.06);\\n    for (const wx of [2.7, 11.9]) box(g, u + '_street_window', mat.dark, ux + wx, ux + wx + 7.4, 24.7, 30.6, D, D + t + 0.06);\\n    box(g, u + '_balcon , 32, 20), mat.canopy);\\n  s.name = name + '_canopy'; s.position.set(x*F, (y + 10)*F, z*F); s.castShadow = true; g.add(s);\\n}\\n// Slide 14 pixel → feet (shelter 420 px ≈ 100 ft)\\nconst sx = px => 24 + (px - 136) * 0.238, sz = py => (py - 845) * 0.238;\\n\\nconst model = new THREE.Group(); model.name = 'creekside_park_event_ground';\\n\\nconst site = new THREE.Group(); site.name = 'site';\\nbox(site, 'earth', mat.earth, 0, 345, -4, -0.3, -232, 24);\\nbox(site, 'merriam_drive', mat.asphalt, 0, 24, -0.3, -0.05, -232, 0);\\nbox(site, '57th_street_curbless', mat.asphalt, 0, 345, -0.3, 0.02, 0, 24);\\nbox(site, 'turkey_creek', mat.water, 24, 327, -2.5, -0.6, -232, -212);\\nbox(site, 'bnsf_ballast', mat.drive, 327, 345, -0.3, 1.5, -232, 0);\\nbox(site, 'bnsf_railcar', mat.rail, 331, 341, 1.5, 15, -150, -40);\\nmodel.add(site);\\n\\n// 1 Creek arm + overlook\\nconst arm = new THREE.Group(); arm.name = '1_creek_arm_overlook';\\nbox(arm, 'creek_arm', mat.creekArm, 24, 327, -0.3, 0, -212, -167);\\nfor (let x = 26; x < 325; x += 9) if (Math.abs(x + 2.5 - 194) > 9) box(arm, 'trail_dash', mat.dark, x, x + 5, 0, 0.15, -202.6, -201.4);\\ncyl(arm, 'overlook', mat.yellow, 7, 0.6, 194, 0.3, -202);\\nmodel.add(arm);\\n\\n// 3 Great lawn\\nconst lawn = new THREE.Group(); lawn.name = '3_great_lawn';\\nbox(lawn, 'great_lawn', mat.lawn, 24, 279, -0.3, 0.05, -167, -107);\\nmodel.add(lawn);\\n\\n// 2 Rail-edge berm (9 ft, trail on crest)\\nconst berm = new THREE.Group(); berm.name = '2_rail_edge_berm';\\nconst sh = new THREE.Shape();\\nsh.moveTo(279*F, 0); sh.lineTo(298*F, 9*F); sh.lineTo(308*F, 9*F); sh.lineTo(327*F, 0); sh.closePath();\\nconst bm = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 167*F, bevelEnabled: false }), mat.berm);\\nbm.name = 'berm'; bm.position.z = -167*F; bm.castShadow = bm.receiveShadow = true; berm.add(bm);\\nbox(berm, 'berm_base', mat.creekArm, 279, 327, -0.3, 0, -167, 0);\\nbox(berm, 'crest_trail', mat.trail, 298, 308, 9, 9.25, -167, 0);\\nfor (let i = 0; i < 6; i++) { const z = -150 + i * 27.6; tree(berm, `berm_tree_w_${i+1}`, 290, 5.2, z); tree(berm, `berm_tree_e_${i+1}`, 316, 5.2, z); }\\nmodel.add(berm);\\n\\n// 4 Event ground (from event court slide)\\nconst ev = new THREE.Group(); ev.name = '4_event_ground';\\nbox(ev, 'paved_court', mat.court, 24, 267, -0.3, 0.06, -107, 0);\\nbox(ev, 'service_drive', mat.drive, 267, 279, -0.3, 0.08, -107, 0);\\nbox(ev, 'restroom_storage', mat.blue, 24, sx(256), 0, 12, sz(755), 0);\\n// Shelter ~6,000 SF\\nconst X0 = sx(436), X1 = sx(856), Za = sz(485), Zb = sz(725);\\nbox(ev, 'shelter_roof', mat.shelter, X0, X1, 14, 15.5, Za, Zb);\\nbox(ev, 'shelter_fascia', mat.blue, X0 - 0.5, X1 + 0.5, 13.5, 15.8, Za - 0.5, Za + 0.5);\\nbox(ev, 'shelter_fascia', mat.blue, X0 - 0.5, X1 + 0.5, 13.5, 15.8, Zb - 0.5, Zb + 0.5);\\nfor (const x of [X0 + 1, (X0 + X1) / 2, X1 - 1]) for (const z of [Za + 1, Zb - 1]) box(ev, 'shelter_post', mat.dark, x - 0.5, x + 0.5, 0, 14, z - 0.5, z + 0.5);\\nfor (const px of [486, 566, 646, 726, 806]) for (const py of [585, 665]) {\\n  cyl(ev, 'shelter_table_stem', mat.dark, 0.3, 2.4, sx(px), 1.2, sz(py), 12);\\n  cyl(ev, 'shelter_table_top', mat.white, 4, 0.2, sx(px), 2.5, sz(py));\\n}\\n// Food trucks: [name, body rect, cab rect] in slide-14 px\\nconst trucks = [\\n  ['truck_w1', [181, 251, 385, 505], [181, 251, 505, 545]],\\n  ['truck_w2', [181, 251, 545, 665], [181, 251, 665, 705]],\\n  ['truck_e1', [1041, 1111, 385, 505], [1041, 1111, 505, 545]],\\n  ['truck_e2', [1041, 1111, 545, 665], [1041, 1111, 665, 705]],\\n  ['truck_sw', [276, 396, 730, 800], [396, 436, 730, 800]],\\n  ['truck_se', [856, 976, 730, 800], [976, 1016, 730, 800]],\\n];\\nfor (const [n, b, c] of trucks) {\\n  const g = new THREE.Group(); g.name = n;\\n  const [bx0, bx1, bz0, bz1] = [sx(b[0]), sx(b[1]), sz(b[2]), sz(b[3])];\\n  const [cx0, cx1, cz0, cz1] = [sx(c[0]), sx(c[1]), sz(c[2]), sz(c[3])];\\n  box(g, n + '_body', mat.yellow, bx0, bx1, 2, 12, bz0, bz1);\\n  box(g, n + '_cab', mat.blue, cx0, cx1, 2, 9, cz0, cz1);\\n  const alongX = (Math.max(bx1, cx1) - Math.min(bx0, cx0)) > (Math.max(bz1, cz1) - Math.min(bz0, cz0));\\n  const x0 = Math.min(bx0, cx0), x1 = Math.max(bx1, cx1), z0 = Math.min(bz0, cz0), z1 = Math.max(bz1, cz1);\\n  const wheels = alongX ? [[x0 + 4, z0], [x1 - 4, z0], [x0 + 4, z1], [x1 - 4, z1]] : [[x0, z0 + 4], [x1, z0 + 4], [x0, z1 - 4], [x1, z1 - 4]];\\n  for (const [wx, wz] of wheels) { const w = cyl(g, n + '_wheel', mat.dark, 1.8, 1.2, wx, 1.8, wz); if (alongX) w.rotation.x = Math.PI/2; else w.rotation.z = Math.PI/2; }\\n  if (alongX) box(g, n + '_window', mat.glass, bx0 + 3, bx0 + 13, 6, 10, bz0 - 0.1, bz0 + 0.05);\\n  else { const fx = b[0] < 600 ? bx1 : bx0; box(g, n + '_window', mat.glass, fx - 0.05, fx + 0.1, 6, 10, bz0 + 3, bz0 + 13); }\\n  ev.add(g);\\n}\\nfor (const [i, [px, py]] of [[286, 425], [286, 585], [356, 705], [1006, 425], [1006, 585], [936, 705]].entries()) {\\n  box(ev, `power_pedestal_${i+1}`, mat.blue, sx(px) - 0.8, sx(px) + 0.8, 0, 4.5, sz(py) - 0.8, sz(py) + 0.8);\\n  box(ev, `power_pedestal_${i+1}_panel`, mat.yellow, sx(px) - 0.5, sx(px) + 0.5, 3, 4, sz(py) + 0.8, sz(py) + 0.9);\\n}\\nmodel.add(ev);\\n\\nconst bb = new THREE.Box3().setFromObject(model), ctr = bb.getCenter(new THREE.Vector3());\\nmodel.position.set(-ctr.x, -bb.min.y, -ctr.z);\\nstage.setObject(model);\\n\",\"Gateway Block Plans 3D.html\":\"\\nconst stage = document.querySelector('three-d-stage');\\nconst { THREE } = await stage.ready;\\n\\nconst M = (name, color, rough = 0.8) => { const m = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0 }); m.name = name; return m; };\\nconst mat = {\\n  asphalt: M('asphalt', 0x3f3f3f, 0.9),\\n  blue: M('merriam_blue', 0x0058a0, 0.6),\\n  roof: M('roof_blue_tint', 0x6699c5, 0.7),\\n  glass: M('glass', 0x66ccf5, 0.15),\\n  yellow: M('merriam_yellow', 0xffc425, 0.6),\\n  plaza: M('plaza_paving', 0xffe08a, 0.85),\\n  court: M('court_lawn', 0xd9e98e, 0.9),\\n};\\n\\n// Plan traced from slide pixels; 1 px = 0.15 m. Slide x → world x, slide y → world z (Johnson Drive toward viewer).\\nconst S = 0.15;\\nfunction rect(g, name, m, px0, px1, py0, py1, y0, y1) {\\n  const o = new THREE.Mesh(new THREE.BoxGeometry((px1-px0)*S, y1-y0, (py1-py0)*S), m);\\n  o.name = name; o.position.set((px0+px1)/2*S, (y0+y1)/2, (py0+py1)/2*S);\\n  o.castShadow = o.receiveShadow = true; g.add(o); return o;\\n}\\nfunction building(g, name, px0, px1, py0, py1, h, glassSouth, glassSides) {\\n  rect(g, name, mat.blue, px0, px1, py0, py1, 0, h);\\n  rect(g, name + '_roof', mat.roof, px0 + 3, px1 - 3, py0 + 3, py1 - 3, h, h + 0.05);\\n  const t = 0.1 / S;\\n  if (glassSouth) rect(g, name + '_storefront_south', mat.glass, px0 + 6, px1 - 6, py1 - t, py1 + t, 0.3, 4);\\n  for (const side of glassSides) {\\n    const px = side === 'w' ? px0 : px1;\\n    rect(g, `${name}_storefront_${side}`, mat.glass, px - t, px + t, py0 + 6, py1 - 6, 0.3, 4);\\n  }\\n}\\nfunction monument(g, name, px, py) {\\n  const o = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.6, 2.8), mat.yellow);\\n  o.name = name; o.rotation.y = Math.PI / 4; o.position.set(px*S, 0.8, py*S);\\n  o.castShadow = o.receiveShadow = true; g.add(o);\\n}\\nfunction streets(g, p, x0, x1, y0, y1) {\\n  rect(g, p + 'merriam_dr', mat.asphalt, x0, x0 + 40, y0, y1, -0.3, 0);\\n  rect(g, p + 'kessler_ln', mat.asphalt, x1 - 40, x1, y0, y1, -0.3, 0);\\n  rect(g, p + 'johnson_drive', mat.asphalt, x0 + 40, x1 - 40, y1 - 40, y1, -0.3, 0.001);\\n}\\n\\nconst model = new THREE.Group(); model.name = 'gateway_block_plans';\\n\\n// B // Grow\\nconst b = new THREE.Group(); b.name = 'B_grow';\\nstreets(b, 'B_', 136, 767, 415, 892);\\nrect(b, 'B_court', mat.court, 176, 727, 415, 643, -0.3, 0.02);\\nrect(b, 'B_court_south', mat.court, 176, 499, 643, 700, -0.3, 0.02);\\nrect(b, 'B_plaza', mat.plaza, 176, 499, 700, 852, -0.3, 0.04);\\nrect(b, 'B_building_A_pad', mat.court, 499, 727, 643, 852, -0.3, 0.0);\\nbuilding(b, 'B_building_A', 499, 727, 643, 852,
